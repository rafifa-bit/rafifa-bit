# Gera a cobrinha que come o gráfico de contribuições e grava no branch "output".
name: Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#1a1014&color_dots=#ebedf0,#f2b8a0,#e85d2a,#b3261e,#5a1414
            dist/snake-dark.svg?palette=github-dark&color_snake=#d4a84a&color_dots=#161b22,#5a1414,#b3261e,#e85d2a,#f2c14e

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
